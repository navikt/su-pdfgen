name: Manuell deploy

on:
  workflow_dispatch:
    inputs:
      deploy_prod:
        description: 'Deploy to production'
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  build:
    name: Build and push Docker container
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # needed for push-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.properties', 'settings.gradle.properties', '**/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - uses: actions/setup-java@v6
        with:
          java-version: '19'
          distribution: 'temurin'
      - name: test and build
        run: ./gradlew test build
      - name: Build and push docker image to GAR
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: supstonad
          salsa: true

  deploy_to_dev:
    name: Deploy to dev gcp
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for push-image
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v2
        env:
          VAR: image=${{ needs.build.outputs.image }}
          CLUSTER: dev-gcp
          RESOURCE: nais.yml

  deploy_to_prod:
    name: Deploy to prod
    needs: build
    if: ${{ inputs.deploy_prod == true && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for push-image
    steps:
      - uses: actions/checkout@v4
      - uses: nais/deploy/actions/deploy@v2
        env:
          VAR: image=${{ needs.build.outputs.image }}
          CLUSTER: prod-gcp
          RESOURCE: nais.yml